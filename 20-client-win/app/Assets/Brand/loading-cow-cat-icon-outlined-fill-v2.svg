<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Refined outlined loading cow cat icon</title>
  <desc id="desc">A smooth, design-led flat icon preserving the skewed loading-cat meme expression.</desc>

  <defs>
    <clipPath id="icon-mask">
      <rect x="24" y="24" width="976" height="976" rx="212"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icon-mask)">
    <!-- Warm neutral field -->
    <rect width="1024" height="1024" fill="#cec5b7"/>
    <path d="M0 806 C254 738 532 795 1024 720 V1024 H0Z" fill="#c5bbac"/>

    <!-- Smooth asymmetrical silhouette, kept faithful to the meme's sideward crop. -->
    <path d="
      M 315 1036
      C 329 976 358 931 397 901
      C 323 868 279 807 270 729
      C 263 666 276 581 268 493
      C 261 406 226 331 174 266
      C 137 220 93 174 73 127
      C 61 99 68 70 91 65
      C 106 61 124 75 144 90
      C 223 147 300 196 367 222
      C 426 245 477 233 529 222
      C 571 213 606 220 628 204
      C 648 189 653 153 659 116
      C 669 52 700 23 744 31
      C 785 39 815 81 848 135
      C 890 205 943 251 1024 296
      L 1024 1036 Z"
      fill="#151a1c" stroke="#080b0c" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inner ear uses the same rounded contour vocabulary. -->
    <path d="M 709 83 C 735 61 760 71 783 105 C 806 139 826 174 840 208 C 802 192 766 181 731 174 C 711 154 702 113 709 83Z"
          fill="#907967" stroke="#080b0c" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 732 110 C 750 96 767 111 786 141" fill="none" stroke="#ad9580" stroke-width="11" stroke-linecap="round"/>

    <!-- Continuous white blaze and muzzle with a deliberate rightward sweep. -->
    <path d="
      M 451 451
      C 462 421 484 418 498 452
      C 514 493 519 542 535 596
      C 553 658 591 709 651 745
      C 714 784 799 810 893 831
      C 954 845 993 864 1028 897
      L 1028 1036 L 323 1036
      C 337 979 367 938 405 908
      C 361 878 340 842 343 805
      C 346 766 375 741 404 716
      C 435 690 454 659 460 619
      C 467 575 447 510 451 451Z"
      fill="#f3ecdd" stroke="#080b0c" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- One controlled shadow plane adds depth without losing flat-icon clarity. -->
    <path d="
      M 389 813
      C 454 844 526 850 599 865
      C 686 883 758 925 863 953
      C 740 958 633 943 545 916
      C 469 893 417 858 389 813Z"
      fill="#d8cebd"/>

    <!-- Hollow eyes use matched outline weight but remain intentionally mismatched. -->
    <g id="eyes">
      <path d="M 258 619 C 261 569 287 547 323 548 C 365 548 394 578 396 621 C 399 668 374 700 337 707 C 296 714 263 683 258 619Z"
            fill="#f5edde" stroke="#080b0c" stroke-width="21" stroke-linejoin="round"/>
      <ellipse cx="329" cy="629" rx="34" ry="45" fill="#121719" transform="rotate(-8 329 629)"/>
      <path d="M 568 609 C 574 561 603 543 640 548 C 682 554 705 586 701 628 C 698 672 670 699 634 703 C 594 706 562 674 568 609Z"
            fill="#f5edde" stroke="#080b0c" stroke-width="21" stroke-linejoin="round"/>
      <ellipse cx="637" cy="625" rx="33" ry="43" fill="#121719" transform="rotate(5 637 625)"/>
    </g>

    <!-- Restrained facial notation: neutral rather than cute. -->
    <path d="M 448 787 C 463 795 479 795 493 783 C 489 805 481 818 471 824 C 460 816 452 804 448 787Z" fill="#aa9e8e"/>
    <path d="M 471 821 C 474 839 470 850 460 860 M 471 843 C 490 860 510 861 527 852"
          fill="none" stroke="#aa9e8e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Clean modular spinner, separated visually from the organic outline. -->
    <g id="loading-spinner" fill="#f8f1e3">
      <rect x="455" y="219" width="23" height="68" rx="11.5"/>
      <rect x="455" y="219" width="23" height="68" rx="11.5" transform="rotate(30 466.5 321)" opacity="0.94"/>
      <rect x="455" y="219" width="23" height="68" rx="11.5" transform="rotate(60 466.5 321)" opacity="0.88"/>
      <rect x="455" y="219" width="23" height="68" rx="11.5" transform="rotate(90 466.5 321)" opacity="0.82"/>
      <rect x="455" y="219" width="23" height="68" rx="11.5" transform="rotate(120 466.5 321)" opacity="0.76"/>
      <rect x="455" y="219" width="23" height="68" rx="11.5" transform="rotate(150 466.5 321)" opacity="0.70"/>
      <rect x="455" y="219" width="23" height="68" rx="11.5" transform="rotate(180 466.5 321)" opacity="0.64"/>
      <rect x="455" y="219" width="23" height="68" rx="11.5" transform="rotate(210 466.5 321)" opacity="0.58"/>
      <rect x="455" y="219" width="23" height="68" rx="11.5" transform="rotate(240 466.5 321)" opacity="0.52"/>
      <rect x="455" y="219" width="23" height="68" rx="11.5" transform="rotate(270 466.5 321)" opacity="0.46"/>
      <rect x="455" y="219" width="23" height="68" rx="11.5" transform="rotate(300 466.5 321)" opacity="0.40"/>
      <rect x="455" y="219" width="23" height="68" rx="11.5" transform="rotate(330 466.5 321)" opacity="0.34"/>
    </g>
  </g>

  <!-- Consistent outer keyline -->
  <rect x="24" y="24" width="976" height="976" rx="212" fill="none" stroke="#080b0c" stroke-width="14"/>
</svg>
