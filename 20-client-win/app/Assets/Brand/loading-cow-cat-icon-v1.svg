<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Loading cow cat icon</title>
  <desc id="desc">An uncanny black-and-white cow cat with hollow ring eyes and a loading spinner on its forehead.</desc>

  <defs>
    <clipPath id="app-mask">
      <rect x="32" y="32" width="960" height="960" rx="224"/>
    </clipPath>

    <path id="cat-silhouette" d="
      M 109 901
      L 111 548
      Q 111 450 171 363
      L 132 132
      Q 126 91 159 108
      L 363 246
      Q 472 217 589 242
      L 773 94
      Q 803 70 816 109
      L 854 271
      Q 925 334 940 457
      L 955 901
      Z"/>
  </defs>

  <g clip-path="url(#app-mask)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="#777f79"/>
    <path d="M0 789 Q232 712 459 786 T1024 757 V1024 H0Z" fill="#6d746f" opacity="0.48"/>

    <!-- Subtle vector chromatic fringe keeps the low-fi meme character. -->
    <use href="#cat-silhouette" fill="#79b9ad" opacity="0.12" transform="translate(-6 2)"/>
    <use href="#cat-silhouette" fill="#b46f82" opacity="0.11" transform="translate(6 -2)"/>

    <!-- Black head and upper body -->
    <use href="#cat-silhouette" fill="#090d0e" stroke="#202321" stroke-width="24" stroke-linejoin="miter"/>

    <!-- Uneven inner ears -->
    <path d="M172 157 L319 255 L190 298 Z" fill="#352e29"/>
    <path d="M784 139 L819 280 L654 254 Z" fill="#3a322c"/>
    <path d="M193 181 L278 241 L202 257 Z" fill="#756354"/>
    <path d="M780 177 L794 252 L708 244 Z" fill="#826d59"/>

    <!-- White blaze, muzzle and bib; deliberately not symmetrical. -->
    <path d="
      M 505 385
      L 553 389
      L 545 472
      L 567 548
      Q 575 619 615 666
      Q 672 707 737 733
      Q 803 759 884 785
      L 918 901
      L 215 901
      Q 262 817 331 772
      Q 394 730 449 685
      Q 488 647 496 586
      L 488 486
      Z" fill="#f0eadc"/>

    <!-- Chunky secondary tones make the white area survive downscaling. -->
    <path d="M486 665 Q420 724 331 772 Q408 792 486 764 Q530 748 565 706 Q523 696 486 665Z" fill="#d5cebf"/>
    <path d="M566 704 Q632 738 737 733 Q695 785 610 804 Q552 810 486 764 Q530 747 566 704Z" fill="#e4ddcf"/>
    <path d="M532 401 L553 389 L545 472 L567 548 L548 603 L518 574 Z" fill="#d9d1c2"/>

    <!-- Hollow, mismatched ring eyes. -->
    <g id="eyes">
      <path d="M256 548 Q265 470 343 454 Q428 447 449 522 Q461 603 392 641 Q310 667 270 610 Q251 586 256 548Z" fill="#eee8d9" stroke="#252725" stroke-width="18"/>
      <path d="M316 548 Q322 513 353 510 Q387 512 391 548 Q392 585 357 592 Q321 589 316 548Z" fill="#0a0e0f"/>
      <path d="M618 534 Q632 468 704 465 Q776 467 797 532 Q810 596 754 625 Q679 654 635 607 Q613 578 618 534Z" fill="#eee8d9" stroke="#252725" stroke-width="18"/>
      <path d="M674 543 Q678 514 707 511 Q739 516 740 548 Q736 578 706 581 Q676 576 674 543Z" fill="#0a0e0f"/>
    </g>

    <!-- Minimal nose and broken mouth, kept emotionally blank. -->
    <path d="M509 674 L545 674 L529 692 Z" fill="#4b4842"/>
    <path d="M529 692 L527 713 M527 713 L506 730 M527 713 L549 733" fill="none" stroke="#625e56" stroke-width="10" stroke-linecap="square"/>

    <!-- Loading spinner: independent UI layer, intentionally sharper than the cat. -->
    <g id="loading-spinner" fill="#fffdf5">
      <rect x="518" y="241" width="22" height="72" rx="6"/>
      <rect x="518" y="241" width="22" height="72" rx="6" transform="rotate(30 529 345)" opacity="0.94"/>
      <rect x="518" y="241" width="22" height="72" rx="6" transform="rotate(60 529 345)" opacity="0.86"/>
      <rect x="518" y="241" width="22" height="72" rx="6" transform="rotate(90 529 345)" opacity="0.78"/>
      <rect x="518" y="241" width="22" height="72" rx="6" transform="rotate(120 529 345)" opacity="0.69"/>
      <rect x="518" y="241" width="22" height="72" rx="6" transform="rotate(150 529 345)" opacity="0.61"/>
      <rect x="518" y="241" width="22" height="72" rx="6" transform="rotate(180 529 345)" opacity="0.53"/>
      <rect x="518" y="241" width="22" height="72" rx="6" transform="rotate(210 529 345)" opacity="0.46"/>
      <rect x="518" y="241" width="22" height="72" rx="6" transform="rotate(240 529 345)" opacity="0.40"/>
      <rect x="518" y="241" width="22" height="72" rx="6" transform="rotate(270 529 345)" opacity="0.34"/>
      <rect x="518" y="241" width="22" height="72" rx="6" transform="rotate(300 529 345)" opacity="0.28"/>
      <rect x="518" y="241" width="22" height="72" rx="6" transform="rotate(330 529 345)" opacity="0.22"/>
    </g>

    <!-- Sparse square flecks imitate the source's enlarged compression without raster filters. -->
    <g fill="#bac0ba" opacity="0.20">
      <rect x="80" y="348" width="14" height="13"/>
      <rect x="913" y="414" width="16" height="14"/>
      <rect x="184" y="760" width="11" height="12"/>
      <rect x="842" y="688" width="13" height="11"/>
    </g>
  </g>

  <!-- A thin boundary remains visible on both light and dark launchers. -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="#252a27" stroke-width="12"/>
</svg>
