<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Outlined filled loading cow cat icon</title>
  <desc id="desc">The distorted loading-cat meme composition redrawn as a flat filled icon with heavy outlines.</desc>

  <defs>
    <clipPath id="icon-mask">
      <rect x="24" y="24" width="976" height="976" rx="210"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icon-mask)">
    <!-- Flat background -->
    <rect width="1024" height="1024" fill="#d5cdbf"/>

    <!-- Cat silhouette follows the source meme's skewed three-quarter crop. -->
    <path d="
      M 321 1024
      Q 343 952 386 907
      Q 313 872 276 813
      Q 241 758 243 680
      L 245 476
      Q 244 406 217 347
      Q 177 262 96 176
      Q 52 129 71 76
      Q 79 54 103 66
      Q 240 132 332 181
      Q 407 220 467 214
      Q 531 202 584 210
      Q 615 209 629 192
      Q 647 168 653 117
      Q 661 53 704 30
      Q 750 7 792 50
      Q 835 95 872 159
      Q 914 229 1024 295
      L 1024 1024 Z"
      fill="#15191a" stroke="#080a0a" stroke-width="34" stroke-linejoin="round"/>

    <!-- One muted inner-ear fill; the left ear stays a dark blade like the source. -->
    <path d="M 702 82 Q 744 57 783 105 Q 817 146 844 205 L 731 174 Q 701 151 702 82Z"
          fill="#8d7764" stroke="#080a0a" stroke-width="22" stroke-linejoin="round"/>

    <!-- Cow-cat blaze and broad muzzle are asymmetrical and extend to the lower right. -->
    <path d="
      M 454 450
      Q 466 427 481 445
      Q 492 459 494 489
      Q 499 525 511 559
      Q 521 588 513 621
      Q 504 659 486 695
      Q 474 718 459 735
      Q 442 754 427 779
      Q 414 803 431 823
      Q 452 848 486 864
      Q 516 878 553 888
      Q 633 909 709 923
      Q 804 941 918 955
      L 947 1024 L 348 1024
      Q 362 968 395 930
      Q 422 900 449 879
      Q 402 863 374 831
      Q 353 807 358 780
      Q 362 758 383 741
      Q 419 710 439 677
      Q 454 650 456 610
      Q 457 569 448 529
      Q 438 486 454 450 Z"
      fill="#f1eadb" stroke="#080a0a" stroke-width="28" stroke-linejoin="round"/>

    <!-- A single secondary fill keeps the muzzle dimensional without gradients. -->
    <path d="
      M 429 819
      Q 473 844 519 849
      Q 603 858 670 895
      Q 727 926 804 942
      Q 705 936 613 917
      Q 527 899 480 873
      Q 445 854 429 819 Z"
      fill="#d7cebe"/>

    <!-- Hollow ring eyes retain the source spacing, tilt, and vacant expression. -->
    <g id="eyes">
      <path d="M 257 617 Q 263 566 302 553 Q 345 540 378 568 Q 404 591 403 634 Q 401 682 365 704 Q 325 728 289 703 Q 253 678 257 617Z"
            fill="#f4eddd" stroke="#080a0a" stroke-width="23"/>
      <path d="M 292 625 Q 294 595 318 587 Q 345 581 360 604 Q 373 625 363 650 Q 352 676 326 677 Q 296 675 292 625Z"
            fill="#111516"/>
      <path d="M 566 608 Q 574 557 620 550 Q 666 543 694 574 Q 717 600 711 641 Q 704 684 670 701 Q 628 722 594 695 Q 558 666 566 608Z"
            fill="#f4eddd" stroke="#080a0a" stroke-width="23"/>
      <path d="M 603 621 Q 605 590 631 584 Q 659 581 672 605 Q 684 627 673 651 Q 661 675 636 676 Q 606 673 603 621Z"
            fill="#111516"/>
    </g>

    <!-- Small neutral facial marks, no smile. -->
    <path d="M 448 783 Q 470 796 492 782 Q 482 813 470 820 Q 457 812 448 783Z" fill="#aa9f8f"/>
    <path d="M 470 819 Q 474 844 460 861 M 471 842 Q 497 865 524 856"
          fill="none" stroke="#aa9f8f" stroke-width="12" stroke-linecap="round"/>

    <!-- Forehead loader is a separate, crisp UI symbol. -->
    <g id="loading-spinner" fill="#f7f0e1" stroke="#080a0a" stroke-width="7">
      <rect x="454" y="218" width="24" height="70" rx="9"/>
      <rect x="454" y="218" width="24" height="70" rx="9" transform="rotate(30 466 323)"/>
      <rect x="454" y="218" width="24" height="70" rx="9" transform="rotate(60 466 323)"/>
      <rect x="454" y="218" width="24" height="70" rx="9" transform="rotate(90 466 323)"/>
      <rect x="454" y="218" width="24" height="70" rx="9" transform="rotate(120 466 323)"/>
      <rect x="454" y="218" width="24" height="70" rx="9" transform="rotate(150 466 323)"/>
      <rect x="454" y="218" width="24" height="70" rx="9" transform="rotate(180 466 323)"/>
      <rect x="454" y="218" width="24" height="70" rx="9" transform="rotate(210 466 323)"/>
      <rect x="454" y="218" width="24" height="70" rx="9" transform="rotate(240 466 323)"/>
      <rect x="454" y="218" width="24" height="70" rx="9" transform="rotate(270 466 323)"/>
      <rect x="454" y="218" width="24" height="70" rx="9" transform="rotate(300 466 323)"/>
      <rect x="454" y="218" width="24" height="70" rx="9" transform="rotate(330 466 323)"/>
    </g>
  </g>

  <!-- Launcher boundary -->
  <rect x="24" y="24" width="976" height="976" rx="210" fill="none" stroke="#080a0a" stroke-width="16"/>
</svg>
