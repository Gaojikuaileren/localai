<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Loading cow cat black and white outline icon</title>
  <desc id="desc">A stark black-and-white loading cat icon with uneven ink outlines, hollow eyes, and a forehead spinner.</desc>

  <defs>
    <clipPath id="icon-mask">
      <rect x="34" y="34" width="956" height="956" rx="218"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icon-mask)">
    <!-- Pure white paper field; no gray or color. -->
    <rect width="1024" height="1024" fill="#fff"/>

    <!-- The uneven polygonal contour keeps the source meme's distorted silhouette. -->
    <path d="
      M106 917 L110 555
      Q111 453 168 365
      L131 137 Q124 91 160 108
      L363 249 Q466 218 586 242
      L773 94 Q803 69 816 111
      L853 273 Q925 335 941 459
      L957 917 Z"
      fill="#000" stroke="#000" stroke-width="30" stroke-linejoin="miter"/>

    <!-- White inner-ear cuts with hand-inked contour marks. -->
    <path d="M169 155 L319 257 L188 301 Z" fill="#fff" stroke="#000" stroke-width="15"/>
    <path d="M785 139 L819 283 L651 255 Z" fill="#fff" stroke="#000" stroke-width="15"/>
    <path d="M194 187 L268 239 M184 219 L245 259 M783 183 L704 244 M796 219 L742 256"
          fill="none" stroke="#000" stroke-width="11" stroke-linecap="square"/>

    <!-- White blaze and bib are one bold negative-space shape. -->
    <path d="
      M504 385 L554 390 L545 474 L568 550
      Q575 618 615 665
      Q680 715 742 737
      Q810 761 889 789
      L919 917 L207 917
      Q259 821 330 773
      Q403 725 450 684
      Q489 647 496 587
      L487 486 Z"
      fill="#fff" stroke="#000" stroke-width="15" stroke-linejoin="miter"/>

    <!-- Empty ring eyes: deliberately different sizes and alignment. -->
    <path d="M254 549 Q263 468 344 452 Q427 447 451 522 Q461 605 393 644 Q307 671 266 608 Q250 582 254 549Z"
          fill="#fff" stroke="#000" stroke-width="22"/>
    <path d="M315 548 Q321 510 353 508 Q390 510 394 548 Q394 587 357 595 Q318 591 315 548Z" fill="#000"/>
    <path d="M616 535 Q629 466 704 463 Q780 465 800 531 Q814 598 755 629 Q677 657 632 607 Q611 578 616 535Z"
          fill="#fff" stroke="#000" stroke-width="22"/>
    <path d="M672 543 Q676 511 707 509 Q742 514 743 548 Q738 581 706 584 Q673 578 672 543Z" fill="#000"/>

    <!-- Sparse ink lines imply muzzle volume without soft shading. -->
    <path d="M343 752 Q418 789 489 752 M567 752 Q638 798 739 752"
          fill="none" stroke="#000" stroke-width="12" stroke-linecap="square"/>
    <path d="M510 673 L546 673 L528 694 Z" fill="#000"/>
    <path d="M528 694 L526 715 M526 715 L505 733 M526 715 L550 735"
          fill="none" stroke="#000" stroke-width="11" stroke-linecap="square"/>
    <path d="M293 835 L365 855 M681 845 L770 819 M246 872 L326 891 M732 884 L811 856"
          fill="none" stroke="#000" stroke-width="9" stroke-linecap="square"/>

    <!-- The white spinner remains a separate, clean UI layer on the black forehead. -->
    <g id="loading-spinner" fill="#fff">
      <rect x="518" y="238" width="23" height="74" rx="4"/>
      <rect x="518" y="238" width="23" height="74" rx="4" transform="rotate(30 529.5 345)"/>
      <rect x="518" y="238" width="23" height="74" rx="4" transform="rotate(60 529.5 345)"/>
      <rect x="518" y="238" width="23" height="74" rx="4" transform="rotate(90 529.5 345)"/>
      <rect x="518" y="238" width="23" height="74" rx="4" transform="rotate(120 529.5 345)"/>
      <rect x="518" y="238" width="23" height="74" rx="4" transform="rotate(150 529.5 345)"/>
      <rect x="518" y="238" width="23" height="74" rx="4" transform="rotate(180 529.5 345)"/>
      <rect x="518" y="238" width="23" height="74" rx="4" transform="rotate(210 529.5 345)"/>
      <rect x="518" y="238" width="23" height="74" rx="4" transform="rotate(240 529.5 345)"/>
      <rect x="518" y="238" width="23" height="74" rx="4" transform="rotate(270 529.5 345)"/>
      <rect x="518" y="238" width="23" height="74" rx="4" transform="rotate(300 529.5 345)"/>
      <rect x="518" y="238" width="23" height="74" rx="4" transform="rotate(330 529.5 345)"/>
    </g>

    <!-- Two broken edge marks mimic rough photocopy registration. -->
    <path d="M91 412 L91 529 M934 604 L939 692" fill="none" stroke="#000" stroke-width="13"/>
  </g>

  <rect x="34" y="34" width="956" height="956" rx="218" fill="none" stroke="#000" stroke-width="14"/>
</svg>
