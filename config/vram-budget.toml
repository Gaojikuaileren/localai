# =============================================================================
#  vram-budget.toml — 显存预算与组件表(唯一数据源)
#  对应方案书 v2.2 §8.1 / §8.1.2 · 决议 D24(弃核显)· D25(勾选式组件选择器)
#
#  ★ 组件 peak 一律用 P1 实测值。改这里就改了闸的判据 —— 别在代码里散落数字。
#  ★ `cap` 这个词已全文废止(D24):降它一个字节都腾不出来,因为桌面占用不从里面扣。
#     真正可调的是 desktop_floor(给桌面至少留多少),vram_budget 是它的导出值。
# =============================================================================

schema_version = 1
plan_version   = "v2.2"
updated        = "2026-07-28"

[budget]
# RTX 5080 可用显存(实测 16303 MiB ≈ 15.92 GiB)
total_vram    = 15.92
# ★ 你设的「至少给桌面留多少」。P1-A7 实测桌面重负载上界 6.53 → 定 6.6。
#   跨会话持久,不是逐请求参数。改它需要哈希绑定批准(与「新增 rw 权限区域」同级)。
desktop_floor = 6.6
# 安全余量:动态闸要求申请后仍剩这么多
safety_margin = 0.8
# 标定状态:A7 已实测,但只覆盖「一般工作情景」,故 partial 而非 true
calibrated    = "partial"

# ★ 标定指纹(P4 起由 vram_gate 在启动期比对;不一致则拒绝启动并说清要重测什么)
#   —— 与记忆系统 S2 的「编码指纹」同一手法:不一致时不会崩,只会悄悄给出错误结论。
#   两组指纹各自驱动不同的重测项,因为它们的可移植性不同:
#     GPU 指纹不符  → 重测组件 peak 里【与硬件相关的部分】(主要是 CUDA context,即 P1-A1)
#     显示指纹不符  → 重测 desktop_floor(A7)
#   ★ desktop_floor 的决定因素是【显示配置】而非 GPU 型号 —— 桌面工作集由分辨率与
#     显示器数量决定。换卡但显示不变时 6.6 大体可移植;换显示器则必须重测,哪怕 GPU 没动。
#   详见 00-docs/PROJECT_PLAN_v3.0.md §13 B10。
[calibration]
gpu_name       = "NVIDIA GeForce RTX 5080"
gpu_total_vram = 15.92
driver         = "610.62"
measured_at    = "2026-07-27"
# 显示指纹留空 = 尚未记录;P4 实现时补测并填入(换显示器要重测 desktop_floor)
# ★★ 以下两项是 2026-08-04(P4-S6)【补录】的,不是 2026-07-27 测量时记下来的。
#   ⇒ 它们只能检测「08-04 之后」的换卡;07-27~08-04 之间若换过同型号卡,我们不知道,
#     而且**不假装知道**。把今天的值追认为当时的测量条件,是一次伪装成"补录"的捏造。
gpu_uuid         = "GPU-02a133e7-9303-fbbb-073d-bb9c87ff5df1"
vbios            = "98.03.3b.00.b4"
uuid_recorded_at = "2026-08-04"
# ★★ 显示指纹:**未标定,且不可回填**。
#   P1-A7(2026-07-26)那轮没有记录分辨率与显示器数量:p1-data 三个 CSV 没有这一列、
#   P1-thresholds 的负载描述只列进程不列显示配置、07 月 worklog 全无记录。
#   ⇒ 只能重跑 A7 并这次把显示配置一起记下来,或明写"未标定"。
#   ⇒ **必须拒绝**"读今天的配置填进去" —— 那是把今天的配置追认为 A7 的测量条件。
#     (今天这台接的是 2560x1440 + 1280x1024 双屏、均 100% 缩放;此处**故意不填**。)
#   另注:本机装有 Parsec Virtual Display Adapter(Status=OK),串流接入会改变显示器数量;
#   即使将来标定了,只在启动期比对也检测不到运行期的显示变化 —— 文档不得让人以为有运行期强制。
display_calibrated = false
display_note   = "P1-A7 测于当时的显示配置;分辨率/显示器数量未记录 —— 不可回填,须重测 A7"
# 导出值(不单独设):vram_budget = total_vram - desktop_floor - safety_margin = 8.52

# =============================================================================
#  组件表 —— peak 为【实测】值(§8.1.2,2026-07-27 P1 收官后更新)
#  kind: llm(单选组)/ speech / vlm / image
#  port: ★ 仅登记用,当前【没有任何代码读它】(2026-07-31 审计更正)——
#        start-stack.ps1 里的端口是【写死的】(18081 / 8080),不来自这里;null 表示该组件不监听端口。
#        同一份端口事实目前散在本文件、start-stack.ps1、各服务默认值三处,接 Broker 时收敛到一处。
# =============================================================================
# ★ 2026-08-04(P4-S9)新增 display:组件的【人话名】。
#   起因:客户端 Views/ModelCatalog.cs 自造了一份清单(chat.8b / speech / image),
#   那是**第三套词汇** —— 跟网关别名对不上,跟这里的组件 id 也对不上,谁也映射不到谁。
#   ⇒ 名字收进唯一数据源,由 GET /v1/gpu/components 下发。
#   ★ display **可以缺**:缺了目录会回落到 id 本身,而不是把该组件从面板上藏掉 ——
#     一个没起名字的组件仍然占显存,用户必须看得见它。
[components."llm.assistant.8b@16k"]
display = "日常对话 · 8B"
peak = 5.92
kind = "llm"
port = 18081
note = "日常主力。P1-A2 实测(q8_0 KV;F16 下是 6.97)"

[components."llm.assistant.8b@32k"]
display = "长上下文 · 8B / 32K"
peak = 7.19
kind = "llm"
port = 18081
note = "长上下文。q8_0 省 2.04,使 32K 从「日常用不了」变可用(B3b 零质量损失)"

[components."llm.assistant.8b@8k"]
# ★ 2026-08-04 更正:原值 5.0 是转抄错误 —— 5.0 是 NUM-1 表里这一行的【权重】列,
#   不是 peak 列。peak 列写的是 5.31 ★实测(权重 5.0 + q8 KV 0.61 + CUDA ctx 0.4 的实测结果)。
#   证据:toml 其余 8 个组件的 peak 与 NUM-1 peak 列【逐字相等】,唯独这一行不等,
#   而它不等的那个值恰好等于同行的权重列。⇒ 转抄错误,不是判据分歧。
#   方向也是 fail-safe 的:5.31 > 5.0,闸变更保守(原值会低估 0.31 GiB,可能放行本该拒的申请)。
#   ★ 该组件在 start-stack -Ctx≤8192 的生产路径上,不是冷门项。
display = "日常对话 · 8B(短上下文)"
peak = 5.31
kind = "llm"
port = 18081
note = "语音场景(assistant.voice 契约)。P1 实测 5.31(F16 下 5.83)"

[components."llm.assistant.30b-a3b@32k"]
display = "深度模式 · 30B-A3B"
peak = 11.9
kind = "llm"
port = 18082
note = "深度模式。ngl30 · 38% offload · 57.5 tok/s(MoE 只 3B 活跃,offload 几乎免费)"

[components."speech.lite"]
display = "语音 · 听写 + 朗读(轻)"
peak = 2.07
kind = "speech"
port = 18085
note = "turbo ASR 2.07 GPU + Piper CPU TTS 0(原估 1.4 偏低)"

[components."speech.full"]
display = "语音 · 听写 + 朗读(全)"
peak = 4.05
kind = "speech"
port = 18085
note = "large-v3 ASR + Piper CPU TTS"

[components."vlm.small"]
display = "视觉 · 看图理解"
peak = 4.35
kind = "vlm"
port = 18083
note = "Qwen2.5-VL-3B。★ 实测比原估 2.5 重 74% —— 原估漏算 mmproj f16 1.25"

[components."comfyui.sdxl"]
display = "绘图 · SDXL"
peak = 8.14
kind = "image"
port = 0
note = "P1-D1 实测 1024²(原估 11.0 偏高)。JOB 平面,不由 start-stack 管"

[components."comfyui.sdxl.lowvram"]
display = "绘图 · SDXL(省显存)"
peak = 7.8
kind = "image"
port = 0
note = "低显存模式"

# =============================================================================
#  推荐组合(D25 侧栏)—— 100% 由实测 peak 组成,无估算项
#  ★ 一键套用是一次【普通的】集合变更,走完全相同的三道闸,不走捷径。
# =============================================================================
[presets.daily]
label      = "日常"
components = ["llm.assistant.8b@16k", "speech.lite"]
note       = "7.99 ≤ 8.52 ✓ 余 0.53"

[presets.long_context]
label      = "长上下文"
components = ["llm.assistant.8b@32k"]
note       = "7.19 ≤ 8.52 ✓ 余 1.33。★ 加 speech.lite 就超(9.26),这正是闸存在的意义"

[presets.deep]
label      = "深度模式"
components = ["llm.assistant.30b-a3b@32k"]
note       = "11.9 > 8.52 ✗ —— 在 desktop_floor=6.6 下【装不下】。要用它必须先降桌面预留"

[presets.vision]
label      = "视觉"
components = ["llm.assistant.8b@16k", "vlm.small"]
note       = "10.27 > 8.52 ✗ —— 同上,vlm.small 实测比估算重 74% 后这组变紧了"
