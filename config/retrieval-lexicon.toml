# =============================================================================
#  retrieval-lexicon.toml — 选路用的闭合词表(§4.2 双轨编排器)
#
#  ★ 这份词表【只用于决定走哪条轨】,不用于回答问题、不用于认实体。
#    因此它可以是纯粹的、静态的、可测试的 —— route() 是纯函数,不碰数据库。
#
#  ★★ 三条设计教训(2026-07-28 对抗性核验,均为纸面即失败):
#
#  1. 【子串匹配,不是集合成员】
#     「我妹妹叫什么名字」里的疑问片段是「叫什么名字」。若按集合成员判定,而表里只有
#     「叫什么」「什么名字」,就【不命中】→ 走错轨 → 验收例句直接答不出来。
#     故:所有条目按【子串】匹配归一化后的整句。
#
#  2. 【选路的归一化必须独立于 E1,绝不可共用】
#     E1 的 normalize 把中文数字转阿拉伯(为了还原被念成「一二三」的卡号),
#     套到称谓上会把最常见的一族排行称谓打掉:二姐→2姐 · 三妹→3妹 · 老三→老3。
#     同名不同职:凭证检测要「把数字还原」,选路要「把称谓保住」。共用即毁。
#
#  3. 【三语并列】用户在德语环境、说中文、项目文档是中文 —— 中德英混说是常态不是边角。
#     词表纯中文的话,"Wie heißt meine Schwester" 结构上就走不到结构化轨。
# =============================================================================

schema_version = 1
updated        = "2026-07-28"

# -----------------------------------------------------------------------------
#  关系/称谓词 —— 出现它 = 大概率在问「某个人/物的属性」,倾向结构化轨
#  ★ 中文含排行称谓(二姐/三妹/老三…),正是被 E1 归一化毁掉的那一族,必须能命中
# -----------------------------------------------------------------------------
[signals.relation]
zh = ["妹妹", "妹", "小妹", "大妹", "二妹", "三妹",
      "姐姐", "姐", "大姐", "二姐", "三姐",
      "哥哥", "哥", "大哥", "二哥", "三哥",
      "弟弟", "弟", "小弟", "大弟",
      "爸爸", "爸", "父亲", "老爸",
      "妈妈", "妈", "母亲", "老妈",
      "老婆", "老公", "爱人", "妻子", "丈夫", "对象",
      "儿子", "女儿", "孩子",
      "爷爷", "奶奶", "外公", "外婆", "姥姥", "姥爷",
      "叔叔", "阿姨", "舅舅", "姑姑", "伯伯",
      "老三", "老二", "老大", "老四"]
de = ["schwester", "bruder", "mutter", "mama", "vater", "papa",
      "frau", "mann", "ehefrau", "ehemann", "partnerin", "partner",
      "sohn", "tochter", "kind", "oma", "opa", "großmutter", "großvater",
      "tante", "onkel", "cousine", "cousin"]
en = ["sister", "brother", "mother", "mom", "father", "dad",
      "wife", "husband", "partner", "son", "daughter", "child",
      "grandma", "grandpa", "aunt", "uncle", "cousin"]

# -----------------------------------------------------------------------------
#  属性疑问词 —— 出现它 = 在问一个【确切的值】,向量轨给不出确切值
#  ★ 长片段在前:「叫什么名字」必须先于「叫什么」被匹配到(见 route.py 的最长匹配)
# -----------------------------------------------------------------------------
[signals.attribute_q]
zh = ["叫什么名字", "叫什么", "什么名字", "名字是", "名字叫", "叫啥",
      "是谁", "哪一个", "哪个",
      "生日", "几号", "几点", "多少岁", "多大",
      "电话", "手机号", "多少号",
      "什么型号", "什么牌子", "哪个牌子",
      "住哪", "在哪", "住在哪", "哪里人",
      "多少", "几个"]
de = ["wie heißt", "wie heisst", "name von", "wer ist", "welche", "welcher",
      "geburtstag", "wann geboren", "wie alt", "telefonnummer", "wo wohnt", "woher"]
en = ["what is the name", "what's the name", "whats the name", "name of",
      # ★ 英语所有格结构:"what's my sister's name" 中间夹着 "my sister's",
      #   前面那几条都不命中。测试实际抓到过这个漏网(2026-07-28)。
      "'s name", "s name", "her name", "his name", "their name",
      "your name", "my name", "called",
      "who is", "which one", "birthday", "how old", "phone number",
      "where does", "where do", "where is"]

# -----------------------------------------------------------------------------
#  情节指示词 —— 指向「过去某次对话/事件」,只有向量轨能找回来
# -----------------------------------------------------------------------------
[signals.episodic]
zh = ["上次", "上回", "之前", "前几天", "那天", "刚才", "昨天", "前天",
      "我们聊过", "我们说过", "聊到的", "说过的", "提过的", "讨论过",
      "你还记得", "还记得吗", "记不记得", "那个时候", "当时"]
de = ["letztes mal", "neulich", "vorhin", "gestern", "vorgestern", "damals",
      "wir haben besprochen", "wir sprachen", "erinnerst du dich", "weißt du noch"]
en = ["last time", "earlier", "yesterday", "the other day", "before",
      "we talked about", "we discussed", "do you remember", "remember when"]

# -----------------------------------------------------------------------------
#  同义折叠 —— 归一化后再折叠(★ 在中文数字转换【之外】,不依赖它)
# -----------------------------------------------------------------------------
[fold]
"小妹" = "妹妹"
"大妹" = "妹妹"
"老妈" = "妈妈"
"老爸" = "爸爸"
"妈"   = "妈妈"
"爸"   = "爸爸"
"wie heisst" = "wie heißt"
"whats the name" = "what's the name"
