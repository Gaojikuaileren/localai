# =============================================================================
#  paths.toml — 唯一路径配置源
#  本地 AI 中枢 · 对应方案书 v2.2 §11.1「路径契约」
#
#  · 换盘时只改本文件,重启服务,校验哈希
#  · 代码中禁止出现绝对路径 — pre-commit 钩子会拦截
#  · 数据库存 {root, rel} 二元组,不存绝对路径 → 迁移后数据库零改动
# =============================================================================

schema_version = 1
plan_version   = "v2.2"
updated        = "2026-07-26"

# -----------------------------------------------------------------------------
#  五个逻辑根 — 备份、GC、迁移策略各不相同,故物理分离
# -----------------------------------------------------------------------------
[roots]
code   = 'E:\.meine\.Proj_Soft\.Proj\.localAI'   # CODE    git 管理,GC 不碰
models = 'D:\AI\models'                          # MODELS  引用计数保护,只提示不自动删
assets = 'D:\AI\assets'                          # ASSETS  三池分级
state  = 'D:\AI\state'                           # STATE   只归档不删
cache  = 'D:\AI\cache'                           # CACHE   唯一可静默清理的根

# ⚠ 物理布局实测 (2026-07-26):
#     Disk 0  Samsung 9100 PRO 1TB  ->  C:
#     Disk 1  Samsung 9100 PRO 2TB  ->  D: + E:
#   code 根(E:)与 models/assets/state/cache(D:)在同一块物理盘上。
#   该盘故障 = 代码与数据同时丢失。见 [backup]。

[cache]
hf    = 'D:\AI\cache\hf'
torch = 'D:\AI\cache\torch'
tmp   = 'D:\AI\cache\tmp'

[assets]
draft    = 'D:\AI\assets\draft'      # 未被采纳的候选,TTL 后回收(保留 Asset Spec)
adopted  = 'D:\AI\assets\adopted'    # 你标记为要用的,永久保留 + 纳入备份
exported = 'D:\AI\assets\exported'   # 已导入 UE5,此处只留元数据引用

[state]
db           = 'D:\AI\state\db'
logs         = 'D:\AI\state\logs'
tickets      = 'D:\AI\state\tickets'
quarantine   = 'D:\AI\state\quarantine'   # delete 的替代品,保留 N 天
memory       = 'D:\AI\state\memory'       # P3a 创建 · 普通文件夹 · PostgreSQL + Qdrant
                                          # ★ D22:不加密。磁盘与备份盘上均为明文,见 §4.6

[external]
comfyui = 'D:\ComfyUI'   # 保持原位,经 extra_model_paths.yaml 挂接(P8)

# -----------------------------------------------------------------------------
#  备份 — §8.5
# -----------------------------------------------------------------------------
[backup]
status = "manual"          # 手动触发:你插上移动固态后运行 90-ops\backup\backup.ps1
target = ""                # 留空 = 运行时由 -Target 参数指定盘符
mode   = "手动触发,脚本保证一致性"

# 保留策略 — §8.5「12 代全量」
# 脚本只**报告**超出保留数的旧备份集,不自动删除
# (与 §8.4 GC 的原则一致:除 CACHE 根外一律先报告后执行)
# 确需清理时用 backup.ps1 -PruneOld,删除前会打印完整清单
keep_last = 12

# 备份介质是否必须加密 — 决议 D21 (2026-07-26)
#   false = 允许备份到未加密介质(用户决定:不加密,就简单备份)
#   true  = 未加密目标直接拒绝执行
require_encryption = false

# 决议 D17/D21/D22 (2026-07-26):
#   · 备份为**手动**触发,目标是移动固态。脚本负责一致性,你负责什么时候插盘跑
#   · 备份介质**不加密**(D21)
#   · 记忆库本身也**不加密**(D22)—— 磁盘与备份盘上均为明文,见 §4.6
#
# ⚠ 仍然成立的铁律:
#   1. 「没演练过的备份不算备份」:P3a 上线前须跑通一次完整恢复
#   2. 校验清单必须可移植(无 BOM · LF · 正斜杠 · GNU sha256sum 兼容)
#   3. 备份目录对文件回收器不可见
#   4. ★ 活数据库不能做文件级复制。P3a 起 PostgreSQL 走 pg_dump,
#      Qdrant 走 snapshot API —— 否则「备份成功但恢复不出来」。见 §8.5.5
#
# ⚠ 物理布局提醒:E: 与 D: 同为 Disk 1,备到 E: 等于没备。
#   备份目标必须是移动固态或将来装在空 M.2 插槽上的新盘。

# -----------------------------------------------------------------------------
#  GC — §8.4
# -----------------------------------------------------------------------------
[gc]
# 白名单:永不自动回收
whitelist = [
  "state",     # 含记忆库、审批票据、(将来的)交易账本
  "backup",    # 备份目录对回收器不可见 — §8.5 铁律 4
]

# cache/hf 例外 —— 已确认并写回方案书 §8.4.1 (2026-07-26)
#   cache/hf 语义上属 CACHE 根(可重新下载),但重获成本高:动辄十几到几十 GB,
#   实测下载仅 ~11 MB/s(17GB 约需 27 分钟),且部分模型可能下架或改许可。
#   分界不该只看「能不能重建」,还要看「重建的代价」。
#   代替做法:交由模型管家(§5.3)按「最后使用时间 + 重获成本」提示,只提示不自动删。
hf_cache_auto_purge = false

[gc.watermark]
notify          = 75   # 仅提示
purge_cache     = 85   # 自动清 CACHE 根(受 hf_cache_auto_purge 约束)
purge_draft     = 92   # 回收超过 TTL 的 draft
reject_lease    = 95   # 拒绝发放新 JOB 租约,不中断已有任务
quarantine_days = 30   # 隔离区保留天数

# -----------------------------------------------------------------------------
#  第三方缓存收编 — §11.1 第 3 条
# -----------------------------------------------------------------------------
[env]
HF_HOME    = 'D:\AI\cache\hf'
TORCH_HOME = 'D:\AI\cache\torch'
